<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Cumnor Hurst Map</title>

    <link rel="stylesheet"
          href="style.css?v=1">

</head>


<body>

    <div id="header">
        <a class="back-link" href="/index.html">← Back to Cumnor Hurst</a>
    </div>
  
    <div id="map-container">

        <img id="map-image"
             src="http://gordonstokes.co.uk/temp/hurstmap.jpg"
             alt="Cumnor Hurst map">

        <div id="poi-container"></div>

        <div id="accuracy-circle"></div>

        <div id="position-marker"></div>

    </div>


	<div id="controls">

		<button id="gps-button">
			Show location
		</button>
    
    <button id="poi-button">
      Show points of interest
    </button>

		<span id="gps-status"></span>

	</div>
  
  <div id="poi-popup">
    <button id="poi-close">×</button>

    <img id="poi-image"
         src=""
         alt="">

    <h2 id="poi-title"></h2>

    <p id="poi-text"></p>
  </div>

  <script src="debug.js?v=2"></script>
  <script src="mapReferences.js"></script>
  <script src="mapProjection.js"></script>
  <script src="pois.js?v=2"></script>
  <script src="app.js?v=2d"></script>

</body>

</html>
