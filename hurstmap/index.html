<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Cumnor Hurst Map</title>

    <link rel="stylesheet"
          href="https://www.richardedmonds.com/hillendmap/style.css">

</head>


<body>

    <div id="header">
        <a class="back-link" href="/index.html">← Back to Cumnor Hurst</a>
    </div>
  
    <div id="map-container">

        <img id="map-image"
             src="http://gordonstokes.co.uk/temp/hurstmap.jpg"
             alt="Cumnor Hurst map">

        <div id="poi-container"></div>

        <div id="accuracy-circle"></div>

        <div id="position-marker"></div>

    </div>


	<div id="controls">

		<button id="gps-button">
			Show location
		</button>
    
    <button id="option-button">
      Show options
    </button>

		<span id="gps-status"></span>

	</div>
 
  <div id="options-popup">
    <h2>Map options</h2>

    <div id="overlay-options"></div>
    
    <div class="options-actions">
      <button id="options-cancel">Close</button>
    </div>
  </div>  
 
  <div id="poi-popup">
    <button id="poi-close">×</button>

    <img id="poi-image"
         src=""
         alt="">

    <h2 id="poi-title"></h2>

    <p id="poi-text"></p>
  </div>

  <script src="debug.js"></script>
  <script src="mapReferences.js"></script>
  <script src="https://www.richardedmonds.com/hillendmap/mapProjection.js"></script>
  <script src="pois.js"></script>
  <script src="https://www.richardedmonds.com/hillendmap/app.js"></script>

</body>

</html>
